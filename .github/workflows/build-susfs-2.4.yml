name: Build SUSFS 2.4 OnePlus 15 KMI6 candidate

on:
  push:
    branches:
      - susfs-2.4-port-work
    paths:
      - ".github/workflows/build-susfs-2.4.yml"
      - "susfs4ksu-lkm-port/candidate-v2.4.0/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build arm64 android16-6.12 (KMI6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee
      options: --privileged
    env:
      DDK_IMAGE: ghcr.io/ylarod/ddk-min:android16-6.12-20260828@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee
      SUSFS_KMI: android16-6.12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Inspect DDK build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "KMI=$SUSFS_KMI"
          echo "KDIR=$KDIR"
          echo "KERNEL_SRC=$KERNEL_SRC"
          echo "CLANG_PATH=$CLANG_PATH"
          test -d "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KERNEL_SRC/Makefile"
          echo "DDK kernelrelease=$(make -s -C "$KDIR" kernelrelease)"
          clang --version | head -1
          llvm-strip --version | head -1

      - name: Run host-side source and packaging tests
        shell: bash
        run: |
          set -euo pipefail
          cd susfs4ksu-lkm-port/candidate-v2.4.0
          python3 tools/test_pack.py
          python3 tools/test_layering.py
          python3 tools/test_cfi_sites.py

      - name: Build SUSFS 2.4.0 kernel module
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/susfs4ksu-lkm-port/candidate-v2.4.0"
          mkdir -p "$GITHUB_WORKSPACE/out"
          VERSION="v2.4.0-r1-${GITHUB_SHA:0:7}"
          SUSFS_BUILD_VERSION="$VERSION" \
          SUSFS_KMI="$SUSFS_KMI" \
          SUSFS_OUT="$GITHUB_WORKSPACE/out/susfs_guard_lkm-$SUSFS_KMI.ko" \
            sh "$CANDIDATE/build-lkm.sh"
          echo "SUSFS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build standalone no-ksud loader
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/susfs4ksu-lkm-port/candidate-v2.4.0"
          SUSFS_INSMOD_OUT="$GITHUB_WORKSPACE/out/susfs_insmod" \
            sh "$CANDIDATE/build-insmod.sh"
          readelf -h "$GITHUB_WORKSPACE/out/susfs_insmod" | grep -E "Class:.*ELF64|Machine:.*AArch64"

      - name: Package single-KMI test ZIP (ksud-independent selection)
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/susfs4ksu-lkm-port/candidate-v2.4.0"
          printf '["%s"]\n' "$DDK_IMAGE" > "$GITHUB_WORKSPACE/out/ddk-images.json"
          python3 "$CANDIDATE/tools/pack_module.py" \
            --ko-dir "$GITHUB_WORKSPACE/out" \
            --insmod "$GITHUB_WORKSPACE/out/susfs_insmod" \
            --tag "$SUSFS_VERSION" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --ddk-images "$GITHUB_WORKSPACE/out/ddk-images.json" \
            --kmi-override "$SUSFS_KMI" \
            --out "$GITHUB_WORKSPACE/out/SUSFS-2.4.0-OnePlus15-$SUSFS_KMI.zip"
          unzip -t "$GITHUB_WORKSPACE/out/SUSFS-2.4.0-OnePlus15-$SUSFS_KMI.zip"
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p = Path("out/SUSFS-2.4.0-OnePlus15-android16-6.12.zip")
          with zipfile.ZipFile(p) as z:
              assert z.read("kmi_override") == b"android16-6.12\\n"
              assert z.read("kmis").decode().split() == ["android16-6.12"]
              meta = json.loads(z.read("provenance.json"))
              assert meta["kmi_override"] == "android16-6.12"
              assert meta["base_tag"] == "v2.3.0-r18.9-1"
              assert meta["reference_commit"] == "9ade2f03c7bc2e39b231e0b05105cd548226d2f4"
          print("ZIP structure, KMI override and provenance: PASS")
          PY
          readelf -p .modinfo "$GITHUB_WORKSPACE/out/susfs_guard_lkm-$SUSFS_KMI.ko"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: susfs-2.4.0-oneplus15-android16-6.12
          path: |
            out/susfs_guard_lkm-android16-6.12.ko
            out/susfs_insmod
            out/SUSFS-2.4.0-OnePlus15-android16-6.12.zip
            out/ddk-images.json
          if-no-files-found: error
          retention-days: 14
