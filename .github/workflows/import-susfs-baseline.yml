name: Import original SUSFS 2.3 baseline

on:
  push:
    branches:
      - susfs-2.4-port-work
    paths:
      - .github/workflows/import-susfs-baseline.yml

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout: |
            susfs4ksu-lkm-port
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Fetch exact original release source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/inforcqb/susfs4ksu-for-lkm.git /tmp/susfs-original
          git -C /tmp/susfs-original checkout --detach v2.3.0-r18.9-1
          DEST=susfs4ksu-lkm-port/baseline-v2.3.0-r18.9-1
          mkdir -p "$DEST"
          cp -a /tmp/susfs-original/kernel "$DEST/"
          cp -a /tmp/susfs-original/module "$DEST/"
          cp -a /tmp/susfs-original/tools "$DEST/"
          for f in LICENSE README.md VERSION .gitmodules; do
            if [ -f "/tmp/susfs-original/$f" ]; then cp "/tmp/susfs-original/$f" "$DEST/"; fi
          done
          cat > "$DEST/SOURCE-REVISION.txt" <<'EOF'
          Source repository: https://github.com/inforcqb/susfs4ksu-for-lkm
          Release tag: v2.3.0-r18.9-1
          This is the exact source baseline corresponding to the user's supplied release version.
          It is preserved separately and is not modified by the migration.
          EOF

      - name: Commit original baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add susfs4ksu-lkm-port/baseline-v2.3.0-r18.9-1
          git commit -m "vendor: preserve original SUSFS 2.3 release source baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
